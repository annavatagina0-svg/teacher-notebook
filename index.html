<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4A6CF7">
<title>Блокнот педагога</title>
<link rel="manifest" href="manifest.json">
<style>
/* ═══════════════════════════════════════════════════════════════
   ЛИСТ 1 · ОФОРМЛЕНИЕ (КОМПАКТНОЕ)
   ═══════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #2c3e50; min-height: 100vh; -webkit-font-smoothing: antialiased; }
.screen { display: none; padding: 10px; padding-bottom: 30px; min-height: 100vh; max-width: 600px; margin: 0 auto; }
.screen.active { display: block; }
.hidden { display: none !important; }
h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.subtitle { font-size: 13px; color: #8892a0; margin-bottom: 12px; }

/* Профиль */
.profile-card { display: flex; align-items: center; gap: 10px; background: white; padding: 8px 12px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); margin-bottom: 8px; cursor: pointer; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #4A6CF7, #6B8AFF); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.profile-name { font-size: 14px; font-weight: 600; }
.profile-hint { font-size: 11px; color: #8892a0; margin-top: 1px; }

/* Виджет часов */
#hours-widget { background: #4A6CF7; color:white; border-radius:12px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }

/* Быстрые кнопки */
.quick-actions { display: flex; gap: 8px; margin-bottom: 8px; }
.quick-btn { flex: 1; display: flex; align-items: center; gap: 8px; background: white; border: none; padding: 8px 10px; border-radius: 12px; cursor: pointer; font-family: inherit; box-shadow: 0 2px 6px rgba(0,0,0,0.04); text-align: left; position: relative; overflow: hidden; }
.quick-btn::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; background: #4A6CF7; }
.quick-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 16px; flex-shrink: 0; background: #eef2ff; }
.quick-label { font-size: 13px; font-weight: 700; color: #2c3e50; line-height: 1.1; }
.quick-sub { font-size: 10px; color: #8892a0; }

/* Кнопка отправки */
.send-main-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: #4A6CF7; color: white; border: none; padding: 10px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; box-shadow: 0 2px 8px rgba(74,108,247,0.2); margin-bottom: 8px; }
.send-badge { background: rgba(255,255,255,0.3); padding: 1px 6px; border-radius: 8px; font-size: 12px; }

/* Меню */
.menu-btn { display: flex; align-items: center; gap: 10px; width: 100%; background: white; border: none; padding: 8px 10px; border-radius: 12px; margin-bottom: 6px; cursor: pointer; text-align: left; box-shadow: 0 1px 4px rgba(0,0,0,0.03); font-family: inherit; }
.menu-icon { font-size: 20px; }
.menu-text { flex: 1; }
.menu-title { font-size: 14px; font-weight: 600; color: #2c3e50; }
.menu-sub { font-size: 11px; color: #8892a0; }
.menu-arrow { color: #c5cbd3; font-size: 16px; }

/* Формы */
.form-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.back-btn { width: 32px; height: 32px; border-radius: 10px; background: white; border: none; font-size: 16px; color: #4A6CF7; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
.form-header h2 { font-size: 18px; font-weight: 700; flex: 1; }
.card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
.card h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
.form-group { margin-bottom: 10px; }
label { display: block; font-size: 12px; color: #6b7684; margin-bottom: 4px; font-weight: 500; }
input[type="text"], input[type="number"], input[type="date"], select, textarea { width: 100%; padding: 8px 10px; border: 1.5px solid #e6ecff; border-radius: 10px; font-size: 14px; background: #fafbfe; font-family: inherit; color: #2c3e50; }
input:focus, select:focus, textarea:focus { outline: none; border-color: #4A6CF7; background: white; }
textarea { min-height: 50px; resize: vertical; }
.toggle-group { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle { display: flex; align-items: center; gap: 6px; background: #fafbfe; border: 1.5px solid #e6ecff; padding: 8px 12px; border-radius: 10px; font-size: 13px; cursor: pointer; flex: 1; font-weight: 500; }
.toggle input { width: auto; margin: 0; }
.toggle:has(input:checked) { background: #eef2ff; border-color: #4A6CF7; color: #4A6CF7; }
.sub-block { background: #fafbfe; padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1.5px solid #e6ecff; }
.sub-block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #4A6CF7; }
.sub-block-header button { background: none; border: none; color: #e74c3c; font-size: 16px; cursor: pointer; }
.add-btn { width: 100%; background: white; border: 1.5px dashed #4A6CF7; color: #4A6CF7; padding: 8px; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: 600; margin-top: 6px; }
.save-btn { width: 100%; background: #4A6CF7; color: white; border: none; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px; }

/* Записи */
.record { background: white; padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.03); border-left: 4px solid #4A6CF7; }
.record.cloud { border-left-color: #27ae60; }
.record.unsent { border-left-color: #c5cbd3; opacity: 0.85; }
.record-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 4px; }
.record-header h3 { flex: 1; font-size: 14px; margin-bottom: 0; }
.record-actions { display: flex; gap: 2px; flex-shrink: 0; }
.record-edit, .record-photo { background: none; border: none; font-size: 16px; cursor: pointer; padding: 4px; opacity: 0.8; }
.record-photo { color: #4A6CF7; }
.record p { font-size: 12px; color: #6b7684; margin: 2px 0; }
.record .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.record .tag { background: #eef2ff; color: #4A6CF7; padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 500; }
.record .tag.cloud { background: #e8f8ee; color: #27ae60; }
.record .tag.unsent { background: #f0f3f7; color: #8892a0; }

/* Вкладки */
.tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.tab { flex: 1; padding: 8px; text-align: center; background: white; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 12px; color: #8892a0; box-shadow: 0 1px 4px rgba(0,0,0,0.03); }
.tab.active { background: #4A6CF7; color: white; }

/* Модалка (исправлено: display: none) */
.modal { display: none !important; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal.active { display: flex !important; }
.modal-content { background: white; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; }
.profile-item { padding: 10px 12px; border-radius: 8px; background: #fafbfe; margin-bottom: 6px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; }
.btn-cancel { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #f0f3f7; color: #6b7684; font-weight: 600; margin-top: 10px; cursor: pointer; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #2c3e50; color: white; padding: 10px 20px; border-radius: 10px; font-size: 13px; opacity: 0; transition: 0.3s; z-index: 2000; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* Расписание */
.dropdown-block { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.03); margin-bottom: 8px; overflow: hidden; }
.dropdown-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; font-size: 14px; font-weight: 700; }
.dropdown-head .dd-icon { font-size: 18px; }
.dropdown-head .dd-arrow { margin-left: auto; font-size: 12px; color: #8892a0; transition: transform 0.25s; }
.dropdown-block.open .dropdown-head .dd-arrow { transform: rotate(180deg); }
.dropdown-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; padding: 0 12px; }
.dropdown-block.open .dropdown-body { max-height: 70vh; overflow-y: auto; padding: 0 12px 10px; }
.sched-day { border-top: 1px solid #eef2ff; padding: 6px 0; }
.sched-day-head { display: flex; align-items: center; gap: 6px; padding: 6px; cursor: pointer; font-weight: 600; font-size: 12px; color: #4A6CF7; }
.sched-day-head .sched-count { background: #eef2ff; padding: 1px 6px; border-radius: 8px; font-size: 10px; }
.sched-day-list { display: none; padding: 4px 0; }
.sched-day.open .sched-day-list { display: block; }
.pair-card { background: #fafbfe; border-left: 3px solid #4A6CF7; border-radius: 6px; padding: 6px 8px; margin: 4px 0; font-size: 12px; }
.pair-title { font-weight: 600; font-size: 12px; color: #2c3e50; }
.pair-desc { font-size: 11px; color: #6b7684; }
.sched-empty { text-align: center; color: #8892a0; font-size: 12px; padding: 12px; }

/* Статистика */
.stats-summary { background: #4A6CF7; color: white; padding: 16px; border-radius: 14px; margin-bottom: 10px; }
.stats-summary .big { font-size: 32px; font-weight: 800; }
.stats-summary .bar { margin-top: 10px; height: 6px; background: rgba(255,255,255,0.25); border-radius: 3px; }
.stats-summary .bar > div { height: 100%; background: white; border-radius: 3px; }
.stats-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.stats-tab { flex: 1; padding: 8px 4px; text-align: center; background: white; border-radius: 10px; font-weight: 600; font-size: 11px; color: #6b7684; box-shadow: 0 1px 4px rgba(0,0,0,0.03); white-space: nowrap; }
.stats-tab.active { background: #4A6CF7; color: white; }
.crit-card { background: white; border-radius: 12px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.03); overflow: hidden; border-left: 4px solid #c5cbd3; }
.crit-card.done { border-left-color: #27ae60; }
.crit-card.partial { border-left-color: #f39c12; }
.crit-card.zero { border-left-color: #e74c3c; }
.crit-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
.crit-head-num { width: 24px; height: 24px; border-radius: 6px; background: #eef2ff; color: #4A6CF7; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
.crit-head-name { flex: 1; font-size: 13px; font-weight: 600; }
.crit-head-score { font-size: 14px; font-weight: 800; color: #4A6CF7; }
.crit-body { display: none; padding: 0 12px 12px; }
.crit-card.open .crit-body { display: block; }
.crit-desc { font-size: 11px; color: #6b7684; margin-bottom: 8px; }
.crit-bar { height: 6px; background: #eef2ff; border-radius: 3px; margin-bottom: 8px; }
.crit-bar > div { height: 100%; border-radius: 3px; }
.crit-calc { background: #fafbfe; padding: 8px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #eef2ff; }
.crit-calc-row { display: flex; justify-content: space-between; padding: 4px 6px; font-size: 11px; margin-bottom: 2px; border-radius: 4px; }
.crit-calc-row.base { background: #eef2ff; border-left: 2px solid #4A6CF7; }
.crit-calc-row.bonus { background: #e8f8ee; border-left: 2px solid #27ae60; }
.crit-calc-row.total { background: #f0f3f7; border-left: 2px solid #8892a0; font-weight: 600; }
.crit-calc-row.absent { background: #fde2e2; border-left: 2px solid #e74c3c; }
.crit-advice { font-size: 11px; padding: 6px 8px; border-radius: 6px; background: #fff8e6; color: #92400e; }
.crit-advice.ok { background: #e8f8ee; color: #1e8449; }
.crit-manual label { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #fafbfe; border: 1.5px solid #e6ecff; border-radius: 8px; font-size: 12px; margin-bottom: 4px; }
.crit-manual label:has(input:checked) { background: #eef2ff; border-color: #4A6CF7; color: #4A6CF7; }
.crit-add-btn { width: 100%; padding: 8px; margin-top: 8px; border-radius: 8px; background: #4A6CF7; color: white; border: none; font-size: 12px; font-weight: 600; cursor: pointer; }
.pck-summary { background: #4A6CF7; color: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; text-align: center; }
.pck-summary .num { font-size: 24px; font-weight: 700; }
.pck-teacher { background: white; padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.03); border-left: 4px solid #4A6CF7; cursor: pointer; }
.pck-teacher .name { font-size: 13px; font-weight: 600; }
.pck-teacher .score { font-size: 16px; font-weight: 700; color: #4A6CF7; }
.pck-teacher .pck-body { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e6ecff; }
.pck-teacher.open .pck-body { display: block; }
.pck-row { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid #f0f3f7; font-size: 11px; }

/* Таблицы портфолио */
.portfolio-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 11px; background: white; border-radius: 8px; overflow: hidden; }
.portfolio-table th, .portfolio-table td { border: 1px solid #e6ecff; padding: 6px; text-align: left; }
.portfolio-table th { background: #eef2ff; color: #4A6CF7; font-weight: 600; }
</style>
</head>
<body>

<!-- ЭКРАН ПРИВЕТСТВИЕ -->
<div id="screen-welcome" class="screen active">
    <div class="welcome-box" style="padding: 20px; text-align: center; background: white; border-radius: 16px; margin-top: 20px;">
        <div style="font-size: 40px; margin-bottom: 10px;">📓</div>
        <h1 style="font-size: 18px; margin-bottom: 6px;">Блокнот педагога</h1>
        <p style="font-size: 13px; color: #8892a0; margin-bottom: 16px;">Заполните профиль. Если данные есть в облаке — войдёте в них.</p>
        <div class="form-group" style="text-align:left;"><label>ФИО *</label><input type="text" id="input-fio" placeholder="Иванов Иван Иванович"></div>
        <div class="form-group" style="text-align:left;"><label>Логин *</label><input type="text" id="input-login" placeholder="ivanov"><div class="hint" style="font-size: 10px; color: #8892a0;">Латиница, 3+ символа.</div></div>
        <div class="form-group" style="text-align:left;"><label>Председатель ПЦК *</label><select id="input-pck"></select></div>
        <div class="form-group" style="text-align:left;"><label>Категория *</label><select id="input-category"><option value="">— выберите —</option><option value="высшая">Высшая</option><option value="первая">Первая</option><option value="нет">Нет</option></select></div>
        <div class="form-group" style="text-align:left;"><label>Классное руководство</label><input type="text" id="input-class-group" placeholder="АЭ-11 (если нет — пусто)"></div>
        <label class="checkbox-line" style="margin-bottom: 10px; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="input-is-class-teacher"><span>Я классный руководитель</span></label>
        <label class="checkbox-line" style="margin-bottom: 16px; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="existing-profile-check"><span>У меня уже есть профиль (в облаке)</span></label>
        <button class="btn-primary" onclick="saveProfile()" style="padding: 12px; font-size: 15px;">Войти / Создать</button>
    </div>
</div>

<!-- ЭКРАН ГЛАВНЫЙ -->
<div id="screen-main" class="screen">
    <div class="profile-card" onclick="showProfileSwitcher()">
        <div class="avatar" id="avatar">?</div>
        <div>
            <div class="profile-name" id="teacher-display">—</div>
            <div class="profile-hint" id="teacher-sub">—</div>
        </div>
    </div>

    <!-- ВИДЖЕТ ЧАСОВ -->
    <div id="hours-widget" class="hidden">
        <div>
            <div style="font-size:11px; opacity:0.9;">Выдано часов</div>
            <div style="font-size:20px; font-weight:800;" id="total-hours-display">0 ч</div>
        </div>
        <div style="font-size:24px;">⏱</div>
    </div>

    <!-- РАСПИСАНИЕ -->
    <div class="dropdown-block" id="schedule-block">
        <div class="dropdown-head" onclick="toggleScheduleBlock()">
            <span class="dd-icon">📅</span>
            <span>Расписание</span>
            <span class="dd-arrow">▼</span>
        </div>
        <div class="dropdown-body" id="schedule-body">
            <div class="sched-empty">Нажми, чтобы загрузить</div>
        </div>
    </div>

    <div class="quick-actions">
        <button class="quick-btn" onclick="showLocalRecords()">
            <div class="quick-icon">📋</div>
            <div class="quick-text"><div class="quick-label">Мои записи</div><div class="quick-sub">События</div></div>
        </button>
        <button class="quick-btn" onclick="showStatistics()" id="stats-btn">
            <div class="quick-icon">📊</div>
            <div class="quick-text"><div class="quick-label">Статистика</div><div class="quick-sub">Баллы</div></div>
        </button>
    </div>

    <button class="send-main-btn hidden" id="main-send-btn" onclick="sendToCloud()">
        <span id="main-send-icon">📤</span>
        <span id="main-send-text">Отправить</span>
        <span class="send-badge" id="unsent-count">0</span>
    </button>

    <h1>📓 Разделы</h1>
    <p class="subtitle">Выберите категорию</p>

    <button class="menu-btn" onclick="openForm('event')">
        <span class="menu-icon">🏆</span>
        <div class="menu-text"><div class="menu-title">События</div><div class="menu-sub">Конкурсы, олимпиады</div></div>
        <span class="menu-arrow">→</span>
    </button>
    <button class="menu-btn" onclick="openForm('training')">
        <span class="menu-icon">🎓</span>
        <div class="menu-text"><div class="menu-title">Обучение</div><div class="menu-sub">КПК, стажировки</div></div>
        <span class="menu-arrow">→</span>
    </button>
    <button class="menu-btn" onclick="openForm('assessment')">
        <span class="menu-icon">📊</span>
        <div class="menu-text"><div class="menu-title">Контроль</div><div class="menu-sub">Срезовые, проекты</div></div>
        <span class="menu-arrow">→</span>
    </button>
    <button class="menu-btn" onclick="openForm('methodical')">
        <span class="menu-icon">📚</span>
        <div class="menu-text"><div class="menu-title">Методическая работа</div><div class="menu-sub">УМК, публикации</div></div>
        <span class="menu-arrow">→</span>
    </button>
    <button class="menu-btn" onclick="openForm('activity')">
        <span class="menu-icon">🗣</span>
        <div class="menu-text"><div class="menu-title">Активность</div><div class="menu-sub">Уроки, выступления</div></div>
        <span class="menu-arrow">→</span>
    </button>

    <button class="btn-primary" onclick="forceUpdate()" style="margin-top:12px; background:white; color:#8892a0; border:1.5px solid #eef1f5; box-shadow:none; font-size:13px; padding:10px;">🔄 Обновить</button>
</div>

<!-- ЭКРАН ФОРМА -->
<div id="screen-form" class="screen">
    <div class="form-header"><button class="back-btn" onclick="cancelForm()">←</button><h2 id="form-title">Заполнение</h2></div>
    <div id="form-content"></div>
    <button class="save-btn" onclick="saveRecord()">💾 Сохранить</button>
</div>

<!-- ЭКРАН ЗАПИСИ -->
<div id="screen-records" class="screen">
    <div class="form-header"><button class="back-btn" onclick="backToMain()">←</button><h2>Мои записи</h2></div>
    <div class="tabs">
        <div class="tab active" onclick="switchRecordsTab('my')">📋 Мои записи</div>
        <div class="tab" onclick="switchRecordsTab('stub')">📎 В разработке</div>
    </div>
    <div class="cloud-btn-row" id="cloud-row" style="display:flex; gap:6px; margin-bottom:8px;">
        <button class="load" onclick="loadFromCloud()" id="load-cloud-btn" style="flex:1; padding:8px; border-radius:8px; font-size:12px; background:#e8f8ee; color:#27ae60; border:1.5px solid #d5f0e0;">☁️ Загрузить</button>
        <button class="send" onclick="sendToCloud()" id="send-cloud-btn" style="flex:1; padding:8px; border-radius:8px; font-size:12px; background:#eef2ff; color:#4A6CF7; border:1.5px solid #e6ecff;">📤 Отправить</button>
    </div>
    <div id="records-list"></div>
</div>

<!-- ЭКРАН СТАТИСТИКА -->
<div id="screen-stats" class="screen">
    <div class="form-header">

function openDB() {

        if (db) return resolve(db);
        const req = indexedDB.open('TeacherNotebook', 2);
        req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings');

        };
        req.onsuccess = e => { db = e.target.result; resolve(db); };
        req.onerror = () => reject(req.error);
    });
}

function compressImage(file, maxWidth = 800, quality = 0.7) { return new Promise(resolve => { const reader = new FileReader(); reader.onload = e => { const img = new Image(); img.onload = () => { const canvas = document.createElement('canvas'); let w = img.width, h = img.height; if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; } canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h); resolve(canvas.toDataURL('image/jpeg', quality)); }; img.src = e.target.result; }; reader.readAsDataURL(file); }); }

async function mergeWithCloud() {
    if (!profile) return { added: 0, updated: 0 };
    const data = await downloadJson(getDataFile(profile.fio, profile.login)); if (!data) return { added: 0, updated: 0 };
    const cloudRecords = []; for (const key of ['events','trainings','assessments','methodical','activity']) if (data[key]) cloudRecords.push.apply(cloudRecords, data[key]);
    const localRecords = (await getAllRecords()).filter(r => r.teacher === profile.fio); const localByKey = new Map(); for (const r of localRecords) localByKey.set(recordKey(r), r);
    let added = 0, updated = 0;
    for (const cloud of cloudRecords) {
        const key = recordKey(cloud); const local = localByKey.get(key);
        if (!local) { cloud.teacher = profile.fio; cloud.sent = true; cloud.fromCloud = true; await saveRecordToDB(cloud); added++; }
        else if (new Date(cloud.updatedAt) > new Date(local.updatedAt)) { cloud.id = local.id; await updateRecord(cloud); updated++; }
    }
    return { added, updated };
}
function recordKey(r) { return r.uid || (r.createdAt ? 'c:' + r.createdAt : null); }

async function sendToCloud() {
    const btn = document.getElementById('send-cloud-btn'); btn.disabled = true; btn.textContent = '⏳...';
    await mergeWithCloud();
    const allRecords = (await getAllRecords()).filter(r => r.teacher === profile.fio);
    if (allRecords.length) {
        await ensureFolder(ROOT_FOLDER + '/Входящие');
        const data = await buildDataFile(); await uploadToYandex(getDataFile(profile.fio, profile.login), JSON.stringify(data, null, 2));
        for (const r of allRecords) { r.sent = true; await updateRecord(r); }
        showToast('✅ Отправлено');
    }
    btn.disabled = false; btn.textContent = '📤 Отправить'; updateUnsentCount();
}
function getYear() { const now = new Date(); const y = now.getFullYear(); const m = now.getMonth() + 1; const start = m >= 9 ? y : y - 1; return start + '-' + (start + 1); }
function slug(str) { return String(str || '').trim().replace(/[^a-zA-Zа-яА-Я0-9\s\-_.]/g, '').replace(/\s+/g, '_').slice(0, 60) || 'без_названия'; }
async function ensureFolder(diskPath) { await fetch('https://cloud-api.yandex.net/v1/disk/resources?path=' + encodeURIComponent(diskPath), { method: 'PUT', headers: { 'Authorization': 'OAuth ' + YANDEX_TOKEN } }); }
async function uploadToYandex(diskPath, content) { const urlRes = await fetch('https://cloud-api.yandex.net/v1/disk/resources/upload?path=' + encodeURIComponent(diskPath) + '&overwrite=true', { headers: { 'Authorization': 'OAuth ' + YANDEX_TOKEN } }); const data = await urlRes.json(); await fetch(data.href, { method: 'PUT', body: content }); }
async function downloadJson(diskPath) { try { const url = PROXY_URL + 'path=' + encodeURIComponent(diskPath) + '&token=' + encodeURIComponent(YANDEX_TOKEN) + '&_=' + Date.now(); const res = await fetch(url); if (!res.ok) return null; const text = await res.text(); return JSON.parse(text); } catch (e) { return null; } }
async function buildDataFile() { const records = (await getAllRecords()).filter(r => r.teacher === profile.fio && r.year === getYear()); return { profile: { fio: profile.fio, login: profile.login }, events: records.filter(r => r.type === 'event'), trainings: records.filter(r => r.type === 'training'), assessments: records.filter(r => r.type === 'assessment'), methodical: records.filter(r => r.type === 'methodical'), activity: records.filter(r => r.type === 'activity'), updated: new Date().toISOString() }; }
async function forceUpdate() { if (!confirm('Обновить?')) return; if ('serviceWorker' in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); for (const r of regs) await r.unregister(); } if ('caches' in window) { const keys = await caches.keys(); for (const k of keys) await caches.delete(k); } location.reload(); }

function normalizeFio(fio) {
    const raw = String(fio || '').trim().replace(/\s+/g, ' ').replace(/\u00A0/g, ' ');
    if (!raw) return '';
    const parts = raw.split(' ');
    let res = parts[0].toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9]/g, '');
    for (let i = 1; i < parts.length; i++) {
        const p = parts[i].trim(); if (!p) continue;
        if (p.indexOf('.') !== -1) { const inits = p.split('.').map(x => x.trim()).filter(x => x); for (const ini of inits) res += ini[0].toLowerCase().replace(/ё/g, 'е'); }
        else res += p[0].toLowerCase().replace(/ё/g, 'е');
    }
    return res;
}
function isAuthor() { return profile && normalizeFio(profile.fio) === normalizeFio(AUTHOR_FIO); }
function isPredsedatel() { if (!profile || !profile.fio) return false; const n = normalizeFio(profile.fio); return PCK_LIST.some(p => normalizeFio(p) === n); }
function isMura() { if (!profile || !profile.fio) return false; return normalizeFio(profile.fio).indexOf('мурашкина') === 0; }

async function renderMyStats(c) {

    const total = (cloudStats && typeof cloudStats.total === 'number') ? cloudStats.total : 0;
    const totalMax = 100; // Максимально возможный балл
    const percent = Math.round(total * 100 / totalMax);

    let html = '<div class="stats-summary">' +
        '<div class="big">' + total + ' <span style="font-size:20px;opacity:0.85;">/ ' + totalMax + '</span></div>' +
        '<div style="font-size:12px;opacity:0.9;">Баллы по критериям</div>' +
        '<div class="bar"><div style="width:' + percent + '%"></div></div>' +
        '<div style="font-size:11px;opacity:0.85;text-align:right;margin-top:4px;">' + percent + '% от максимума</div>' +
        '</div>';

    // Рендерим 15 карточек критериев (даже если баллов 0)
    for (let i = 1; i <= 15; i++) {
        let score = 0;
        if (cloudStats && cloudStats.scores && cloudStats.scores['K'+i]) {
            score = cloudStats.scores['K'+i].score;
        }
        html += `<div class="crit-card ${score > 0 ? 'partial' : 'zero'}" data-code="${i}">
            <div class="crit-head" onclick="toggleCritCard(${i})">
                <div class="crit-head-num">${i}</div>
                <div class="crit-head-name">Критерий ${i}</div>
                <div class="crit-head-score">${score} б.</div>
            </div>
            <div class="crit-body">
                <div class="crit-desc">Данные обновляются после запуска анализа в облаке.</div>
            </div>
        </div>`;
    }
    c.innerHTML = html;
}

function toggleCritCard(code) { const card = document.querySelector('.crit-card[data-code="' + code + '"]'); if (card) card.classList.toggle('open'); }

async function renderPckStats(c) {
    c.innerHTML = '<p style="text-align:center;color:#8892a0;padding:20px;">Загрузка...</p>';
    try {
        const data = await downloadJson(SVODKA_PATH);
        if (!data || !data.rows) { c.innerHTML = '<p style="text-align:center;color:#8892a0;padding:20px;">Нет сводки.</p>'; return; }
        const myPckKey = normalizeFio(profile.pck);
        const myTeachers = data.rows.filter(r => normalizeFio(r['ПЦК'] || '') === myPckKey);
        if (!myTeachers.length) { c.innerHTML = '<p style="text-align:center;color:#8892a0;padding:20px;">Нет данных по ПЦК.</p>'; return; }
        let html = '<div class="pck-summary"><div>Преподавателей: ' + myTeachers.length + '</div></div>';
        const sorted = myTeachers.slice().sort((a, b) => (b['Итого'] || 0) - (a['Итого'] || 0));
        for (const t of sorted) html += '<div class="pck-teacher"><div style="display:flex;justify-content:space-between;"><div><div class="name">' + t['ФИО'] + '</div></div><div class="score">' + (t['Итого']||0) + '</div></div></div>';
        c.innerHTML = html;
    } catch(e) { c.innerHTML = '<p style="text-align:center;color:red;">Ошибка</p>'; }
}

async function renderGeneralStats(c) {
    c.innerHTML = '<p style="text-align:center;color:#8892a0;padding:20px;">Загрузка...</p>';
    try {
        const data = await downloadJson(SVODKA_PATH);
        if (!data || !data.rows) { c.innerHTML = '<p style="text-align:center;color:#8892a0;padding:20px;">Нет сводки.</p>'; return; }
        let html = '<div class="pck-summary"><div>Всего преподавателей: ' + data.rows.length + '</div></div>';
        c.innerHTML = html;
    } catch(e) { c.innerHTML = '<p style="text-align:center;color:red;">Ошибка</p>'; }
}

async function triggerAnalysis() {
    if (!isAuthor()) return;
    let token = localStorage.getItem('github_analyze_token');
    if (!token) { token = prompt('Введите GitHub токен'); if (!token) return; localStorage.setItem('github_analyze_token', token); }
    const btn = document.getElementById('stats-refresh-mini'); if (btn) btn.disabled = true;
    try {
        const res = await fetch('https://api.github.com/repos/annavatagina0-svg/notebook-parsers/actions/workflows/analyze.yml/dispatches', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify({ ref: 'main' }) });
        if (res.status === 204) showToast('✅ Анализ запущен');
        else alert('Ошибка ' + res.status);
    } catch (e) { alert(e.message); } finally { if (btn) btn.disabled = false; }
}

function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 3000); }
</script>

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
