<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4A6CF7">
<title>Блокнот педагога</title>
<link rel="manifest" href="manifest.json">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #2c3e50; min-height: 100vh; -webkit-font-smoothing: antialiased; }
.screen { display: none; padding: 16px; padding-bottom: 40px; min-height: 100vh; max-width: 600px; margin: 0 auto; }
.screen.active { display: block; }
.hidden { display: none !important; }
.welcome-box { margin-top: 6vh; text-align: center; padding: 28px 22px; background: white; border-radius: 24px; box-shadow: 0 8px 32px rgba(74,108,247,0.08); }
.logo { font-size: 52px; margin-bottom: 12px; }
.welcome-box h1 { font-size: 22px; margin-bottom: 8px; font-weight: 700; }
.welcome-box p { color: #8892a0; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
.profile-card { display: flex; align-items: center; gap: 12px; background: white; padding: 14px 16px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 16px; cursor: pointer; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #4A6CF7, #6B8AFF); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex-shrink: 0; }
.profile-name { font-size: 15px; font-weight: 600; }
.profile-hint { font-size: 12px; color: #8892a0; margin-top: 2px; }
.quick-actions { display: flex; gap: 12px; margin-bottom: 20px; }
.quick-btn {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    background: white;
    border: none;
    padding: 14px 16px;
    border-radius: 18px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(74,108,247,0.10);
    transition: 0.15s;
    text-align: left;
    position: relative;
    overflow: hidden;
}
.quick-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 5px;
    background: linear-gradient(180deg, #4A6CF7, #6B8AFF);
}
.quick-btn:active { transform: scale(0.97); box-shadow: 0 2px 6px rgba(74,108,247,0.15); }
.quick-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 20px;
    flex-shrink: 0;
    background: #eef2ff;
}
.quick-btn:nth-child(2) .quick-icon { background: #e8f8ee; }
.quick-text { display: flex; flex-direction: column; min-width: 0; }
.quick-label {
    font-size: 14px;
    font-weight: 700;
    color: #2c3e50;
    line-height: 1.2;
}
.quick-sub {
    font-size: 11px;
    color: #8892a0;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.subtitle { font-size: 14px; color: #8892a0; margin-bottom: 20px; }
.menu-btn { display: flex; align-items: center; gap: 14px; width: 100%; background: white; border: none; padding: 16px; border-radius: 16px; margin-bottom: 10px; cursor: pointer; text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,0.04); font-family: inherit; }
.menu-btn:active { transform: scale(0.98); background: #f8faff; }
.menu-icon { font-size: 26px; }
.menu-text { flex: 1; }
.menu-title { font-size: 15px; font-weight: 600; color: #2c3e50; }
.menu-sub { font-size: 12px; color: #8892a0; margin-top: 2px; line-height: 1.3; }
.menu-arrow { color: #c5cbd3; font-size: 20px; }
.row { display: flex; gap: 10px; margin-bottom: 12px; }
.btn { flex: 1; padding: 14px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; border: 2px solid #e6ecff; background: white; color: #4A6CF7; font-family: inherit; }
.btn:active { transform: scale(0.98); background: #f8faff; }
.btn-primary { width: 100%; padding: 16px; border-radius: 14px; background: #4A6CF7; color: white; border: none; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; box-shadow: 0 4px 16px rgba(74,108,247,0.3); }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { background: #c5cbd3; box-shadow: none; cursor: not-allowed; }
.form-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.back-btn { width: 40px; height: 40px; border-radius: 12px; background: white; border: none; font-size: 20px; color: #4A6CF7; cursor: pointer; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.form-header h2 { font-size: 20px; font-weight: 700; }
.card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.card h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group:last-child { margin-bottom: 0; }
label { display: block; font-size: 13px; color: #6b7684; margin-bottom: 6px; font-weight: 500; }
input[type="text"], input[type="number"], input[type="date"], select, textarea { width: 100%; padding: 12px 14px; border: 1.5px solid #e6ecff; border-radius: 12px; font-size: 15px; background: #fafbfe; font-family: inherit; color: #2c3e50; }
input:focus, select:focus, textarea:focus { outline: none; border-color: #4A6CF7; background: white; }
textarea { min-height: 60px; resize: vertical; }
.hint { font-size: 12px; color: #8892a0; margin-top: 4px; }
.toggle-group { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle { display: flex; align-items: center; gap: 8px; background: #fafbfe; border: 1.5px solid #e6ecff; padding: 12px 16px; border-radius: 12px; font-size: 14px; cursor: pointer; flex: 1; font-weight: 500; }
.toggle input { width: auto; margin: 0; }
.toggle:has(input:checked) { background: #eef2ff; border-color: #4A6CF7; color: #4A6CF7; }
.checkbox-line { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #f8faff; border: 1.5px solid #e6ecff; border-radius: 12px; cursor: pointer; margin-bottom: 12px; font-size: 14px; color: #4A6CF7; font-weight: 500; }
.checkbox-line input { width: auto; margin: 0; }
.checkbox-line:has(input:checked) { background: #eef2ff; border-color: #4A6CF7; }
.sub-block { background: #fafbfe; padding: 14px; border-radius: 12px; margin-bottom: 12px; border: 1.5px solid #e6ecff; }
.sub-block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; font-weight: 600; color: #4A6CF7; }
.sub-block-header button { background: none; border: none; color: #e74c3c; font-size: 20px; cursor: pointer; padding: 0 4px; }
.add-btn { width: 100%; background: white; border: 2px dashed #4A6CF7; color: #4A6CF7; padding: 12px; border-radius: 12px; font-size: 14px; cursor: pointer; font-weight: 600; margin-top: 8px; }
.grade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo-preview { max-width: 100%; max-height: 200px; margin-top: 12px; border-radius: 12px; display: none; }
input[type="file"] { width: 100%; padding: 10px; font-size: 14px; background: #fafbfe; border: 1.5px dashed #e6ecff; border-radius: 12px; cursor: pointer; }
.save-btn { width: 100%; background: #4A6CF7; color: white; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; }
.record { background: white; padding: 16px; border-radius: 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-left: 4px solid #4A6CF7; }
.record.cloud { border-left-color: #27ae60; }
.record.unsent { border-left-color: #c5cbd3; opacity: 0.85; }
.record-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
.record-header h3 { flex: 1; font-size: 15px; margin-bottom: 0; }
.record-actions { display: flex; gap: 2px; flex-shrink: 0; }
.record-edit, .record-delete, .record-photo { background: none; border: none; font-size: 17px; cursor: pointer; padding: 4px 6px; opacity: 0.6; }
.record-photo { opacity: 0.8; color: #4A6CF7; }
.record p { font-size: 13px; color: #6b7684; margin: 3px 0; line-height: 1.4; }
.record .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.record .tag { background: #eef2ff; color: #4A6CF7; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.record .tag.prof { background: #fff4e6; color: #d97706; }
.record .tag.cloud { background: #e8f8ee; color: #27ae60; }
.record .tag.unsent { background: #f0f3f7; color: #8892a0; }
.cloud-btn { width: 100%; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 10px; }
.cloud-btn.load { background: #e8f8ee; color: #27ae60; border: 2px solid #d5f0e0; }
.cloud-btn.send { background: #eef2ff; color: #4A6CF7; border: 2px solid #e6ecff; }
.cloud-btn.manual { background: #fff4e6; color: #d97706; border: 2px solid #fde6c8; }
.cloud-btn.disk { background: #e8f0fe; color: #1a73e8; border: 2px solid #d2e3fc; }
.cloud-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab { flex: 1; padding: 12px; text-align: center; background: white; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; color: #8892a0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.tab.active { background: #4A6CF7; color: white; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal.active { display: flex; }
.modal-content { background: white; padding: 24px; border-radius: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
.modal-content h3 { font-size: 18px; margin-bottom: 16px; }
.profile-item { padding: 12px 16px; border-radius: 10px; background: #fafbfe; margin-bottom: 8px; cursor: pointer; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.profile-item.active { background: #eef2ff; color: #4A6CF7; font-weight: 600; }
.modal-buttons { display: flex; gap: 8px; margin-top: 16px; }
.btn-cancel, .btn-ok { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
.btn-cancel { background: #f0f3f7; color: #6b7684; }
.btn-ok { background: #4A6CF7; color: white; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #2c3e50; color: white; padding: 14px 24px; border-radius: 12px; font-size: 14px; opacity: 0; transition: 0.3s; z-index: 2000; max-width: 90%; text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div id="screen-welcome" class="screen active">
    <div class="welcome-box">
        <div class="logo">📓</div>
        <h1>Блокнот педагога</h1>
        <p>Заполните профиль. Если данные есть в облаке — войдёте в них.</p>
        <div class="form-group" style="text-align:left;"><label>ФИО *</label><input type="text" id="input-fio" placeholder="Иванов Иван Иванович"></div>
        <div class="form-group" style="text-align:left;"><label>Логин *</label><input type="text" id="input-login" placeholder="ivanov (латиница, 3+ символа)"><div class="hint">Придумайте сами. Запомните — понадобится для входа с любого устройства.</div></div>
        <div class="form-group" style="text-align:left;"><label>Председатель ПЦК *</label><select id="input-pck"></select></div>
        <div class="form-group" style="text-align:left;"><label>Категория *</label><select id="input-category"><option value="">— выберите —</option><option value="высшая">Высшая</option><option value="первая">Первая</option><option value="нет">Нет</option></select></div>
        <label class="checkbox-line" style="margin-bottom: 16px;">
            <input type="checkbox" id="input-is-class-teacher">
            <span>Я классный руководитель</span>
        </label>
        <label class="checkbox-line">
            <input type="checkbox" id="existing-profile-check">
            <span>У меня уже есть профиль (в облаке)</span>
        </label>
        <button class="btn-primary" onclick="saveProfile()">Войти / Создать профиль</button>
    </div>
</div>

<div id="screen-main" class="screen">
    <div class="profile-card" onclick="showProfileSwitcher()">
        <div class="avatar" id="avatar">?</div>
        <div>
            <div class="profile-name" id="teacher-display">—</div>
            <div class="profile-hint" id="teacher-sub">—</div>
        </div>
    </div>

   <div class="quick-actions">
    <button class="quick-btn" onclick="showLocalRecords()">
        <div class="quick-icon">📋</div>
        <div class="quick-text">
            <div class="quick-label">Мои записи</div>
            <div class="quick-sub">События и приказы</div>
        </div>
    </button>
    <button class="quick-btn" onclick="showStatistics()" id="stats-btn">
        <div class="quick-icon">📊</div>
        <div class="quick-text">
            <div class="quick-label">Статистика</div>
            <div class="quick-sub">Баллы и отчёты</div>
        </div>
    </button>
</div>
    <h1>📓 Блокнот педагога</h1>
    <p class="subtitle">Выберите раздел</p>

    <button class="menu-btn" onclick="openForm('event')">
        <span class="menu-icon">🏆</span>
        <div class="menu-text"><div class="menu-title">События</div><div class="menu-sub">Конкурсы, олимпиады, фестивали, Абилимпикс</div></div>
        <span class="menu-arrow">→</span>
    </button>
    <button class="menu-btn" onclick="openForm('training')">
        <span class="menu-icon">🎓</span>
        <div class="menu-text"><div class="menu-title">Обучение</div><div class="menu-sub">КПК, стажировки, переподготовка</div></div>
        <span class="menu-arrow">→</span>
    </button>
    <button class="menu-btn" onclick="openForm('assessment')">
        <span class="menu-icon">📊</span>
        <div class="menu-text"><div class="menu-title">Контроль</div><div class="menu-sub">Входной, срезовая, итоговый, проекты</div></div>
        <span class="menu-arrow">→</span>
    </button>
    <button class="menu-btn" onclick="openForm('methodical')">
        <span class="menu-icon">📚</span>
        <div class="menu-text"><div class="menu-title">Методическая работа</div><div class="menu-sub">УМК, программы, публикации</div></div>
        <span class="menu-arrow">→</span>
    </button>
    <button class="menu-btn" onclick="openForm('activity')">
        <span class="menu-icon">🗣</span>
        <div class="menu-text"><div class="menu-title">Трансляция и активность</div><div class="menu-sub">Уроки, выступления, выходы, профориентация</div></div>
        <span class="menu-arrow">→</span>

    <button class="btn-primary" onclick="forceUpdate()" style="margin-top:20px;background:white;color:#8892a0;border:2px solid #eef1f5;box-shadow:none;font-size:14px;">🔄 Обновить приложение</button>
</div>

<div id="screen-form" class="screen">
    <div class="form-header"><button class="back-btn" onclick="cancelForm()">←</button><h2 id="form-title">Заполнение</h2></div>
    <div id="form-content"></div>
    <button class="save-btn" onclick="saveRecord()">💾 Сохранить</button>
</div>

<div id="screen-records" class="screen">
    <div class="form-header"><button class="back-btn" onclick="backToMain()">←</button><h2>Мои записи</h2></div>
    <div class="tabs">
        <div class="tab active" onclick="switchRecordsTab('my')">📋 Мои записи</div>
        <div class="tab" onclick="switchRecordsTab('orders')">📎 Из приказов</div>
    </div>
    <button class="cloud-btn load" onclick="loadFromCloud()" id="load-cloud-btn">☁️ Загрузить из облака</button>
    <button class="cloud-btn manual hidden" onclick="document.getElementById('manual-upload').click()" id="manual-load-btn">📁 Загрузить из файла</button>
    <button class="cloud-btn disk hidden" onclick="openYandexDiskFolder()" id="open-disk-btn">🔗 Открыть файл на Яндекс.Диске</button>
    <input type="file" id="manual-upload" accept=".json" style="display:none" onchange="handleManualUpload(event)">
    <button class="cloud-btn send" onclick="sendToCloud()" id="send-cloud-btn">📤 Отправить в облако</button>
    <div id="records-list"></div>
</div>

<div id="screen-stats" class="screen">
    <div class="form-header"><button class="back-btn" onclick="backToMain()">←</button><h2>📊 Статистика</h2></div>
    <div id="stats-content"></div>
</div>

<div id="screen-edit-profile" class="screen">
    <div class="form-header"><button class="back-btn" onclick="backToMain()">←</button><h2>✏️ Редактировать профиль</h2></div>
    <div class="card">
        <div class="form-group"><label>ФИО</label><input type="text" id="edit-fio"></div>
        <div class="form-group"><label>Логин</label><input type="text" id="edit-login"></div>
        <div class="form-group"><label>Председатель ПЦК</label><select id="edit-pck"></select></div>
        <div class="form-group"><label>Категория</label><select id="edit-category"><option value="высшая">Высшая</option><option value="первая">Первая</option><option value="нет">Нет</option></select></div>
        <label class="checkbox-line" style="margin-top: 10px;">
            <input type="checkbox" id="edit-is-class-teacher">
            <span>Я классный руководитель</span>
        </label>
    </div>
    <button class="save-btn" onclick="saveEditedProfile()">💾 Сохранить изменения</button>

<div id="modal-profile" class="modal">
    <div class="modal-content">
        <h3>Профиль</h3>
        <div id="profiles-list"></div>
        <div class="modal-buttons"><button class="btn-cancel" onclick="closeModal()">Отмена</button></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
const YANDEX_TOKEN = 'y0__wgBEJ3Zn40JGLPrSiD-pYmbGfNv7tdZYi0Z7LRVHG1Sw4vAgj2G';
const ROOT_FOLDER = 'Приложение_Блокнот';
const PROXY_URL = 'https://notebook-proxy.relaxdev.ru/?';

const LEVELS = [
    'образовательная организация',
    'муниципальный',
    'областной',
    'региональный',
    'межрегиональный',
    'всероссийский',
    'международный'
];

function levelsSelect(id, selected) {
    return '<select id="' + id + '">' + LEVELS.map(l => '<option value="' + l + '"' + (l === selected ? ' selected' : '') + '>' + l.charAt(0).toUpperCase() + l.slice(1) + '</option>').join('') + '</select>';
}

const PCK_LIST = [
    'Березина М.С.',
    'Бочкарев Ю.Т.',
    'Горошко В.Э.',
    'Ильина К.А.',
    'Куликова К.С.',
    'Материкова А.А.',
    'Мурашкина С.В.',
    'Трофимова А.М.',
    'Усова М.Н.'
];

let profile = null;
let currentFormType = 'event';
let currentRecordsTab = 'my';
let studentsGroupCounter = 0;
let teacherRolesCounter = 0;
let editingRecordId = null;
let db = null;

function getDataFile(fio, login) { return ROOT_FOLDER + '/Входящие/' + slug(fio) + '_' + login + '_' + getYear() + '.json'; }
function getPhotosFolder(fio, login) { return ROOT_FOLDER + '/Входящие/photos/' + slug(fio) + '_' + login; }
function getStatsFolder(fio, login) { return ROOT_FOLDER + '/Исходящие/' + slug(fio) + '_' + login; }

function recordKey(r) {
    if (r.uid) return r.uid;
    if (r.createdAt) return 'c:' + r.createdAt;
    return null;
}

window.addEventListener('DOMContentLoaded', async () => {
    const pckSelect = document.getElementById('input-pck');
    pckSelect.innerHTML = '<option value="">— выберите —</option>' + PCK_LIST.map(p => '<option value="' + p + '">' + p + '</option>').join('');

    const savedProfile = await getSetting('profile');
    if (savedProfile) {
        profile = savedProfile;
        updateProfileUI();
        showScreen('screen-main');
    } else {
        showScreen('screen-welcome');
    }
});

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
}
function backToMain() { showScreen('screen-main'); }
function cancelForm() { editingRecordId = null; backToMain(); }

// ═══ ПРОФИЛЬ ═══
async function saveProfile() {
    const fio = document.getElementById('input-fio').value.trim();
    const login = document.getElementById('input-login').value.trim();
    const pck = document.getElementById('input-pck').value;
    const category = document.getElementById('input-category').value;
    const isClassTeacher = document.getElementById('input-is-class-teacher').checked;
    const existingProfile = document.getElementById('existing-profile-check').checked;

    if (!fio) { showToast('Введите ФИО'); return; }
    if (!login || login.length < 3 || !/^[a-zA-Z0-9_.-]+$/.test(login)) { showToast('Логин: латиница, 3+ символа'); return; }
    if (!pck) { showToast('Выберите ПЦК'); return; }
    if (!category) { showToast('Выберите категорию'); return; }

    showToast('⏳ Проверяем облако...');

    let cloudData = null;
    let downloadFailed = false;
    try {
        cloudData = await Promise.race([
            downloadJson(getDataFile(fio, login)),
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 30000))
        ]);
    } catch (e) {
        console.warn('Проверка облака не удалась:', e.message);
        downloadFailed = true;
    }

    if (cloudData && cloudData.profile) {
        const total = (cloudData.events||[]).length + (cloudData.trainings||[]).length +
            (cloudData.assessments||[]).length + (cloudData.methodical||[]).length +
            (cloudData.activity||[]).length;
        const isThisYou = confirm(
            'В облаке найдены данные:\n\n' +
            'ФИО: ' + (cloudData.profile.fio || '—') + '\n' +
            'ПЦК: ' + (cloudData.profile.pck || '—') + '\n' +
            'Категория: ' + (cloudData.profile.category || '—') + '\n' +
            'Записей: ' + total + '\n\n' +
            'Это вы? Нажмите ОК — войдёте и подтянете записи.'
        );
        if (!isThisYou) { showToast('Смените логин или ФИО'); return; }

        profile = cloudData.profile;
        profile.isClassTeacher = profile.isClassTeacher || false;
        await saveSetting('profile', profile);
        updateProfileUI();
        showScreen('screen-main');
        const merged = await mergeWithCloud();
        showToast('Записей из облака: +' + merged.added + ', обновлено: ' + merged.updated);
        return;
    }

    if (existingProfile) {
        document.getElementById('manual-load-btn').classList.remove('hidden');
        document.getElementById('open-disk-btn').classList.remove('hidden');
        alert(
            'Вы отметили «У меня уже есть профиль», но не удалось загрузить данные из облака.\n\n' +
            (downloadFailed
                ? 'Похоже, проблема с интернетом. Попробуйте:\n• Переключиться на Wi-Fi\n• Воспользоваться кнопкой «📁 Загрузить из файла»\n• Скачать файл вручную: «🔗 Открыть файл на Яндекс.Диске»\n\nНовый профиль НЕ создан.'
                : 'Возможно, профиль ещё не создан или указаны другие ФИО/логин.\n\nПроверьте данные или снимите галочку и создайте профиль.\n\nНовый профиль НЕ создан.')
        );
        return;
    }

    profile = { fio, login, pck, category, isClassTeacher, year: getYear(), createdAt: new Date().toISOString() };
    await saveSetting('profile', profile);
    updateProfileUI();
    showScreen('screen-main');
    showToast('Профиль создан');
}

async function saveEditedProfile() {
    const newFio = document.getElementById('edit-fio').value.trim();
    const newLogin = document.getElementById('edit-login').value.trim();
    const newPck = document.getElementById('edit-pck').value;
    const newCategory = document.getElementById('edit-category').value;
    const newIsClassTeacher = document.getElementById('edit-is-class-teacher').checked;
    if (!newFio || !newLogin || !newPck || !newCategory) { showToast('Заполните все поля'); return; }
    if (!/^[a-zA-Z0-9_.-]+$/.test(newLogin) || newLogin.length < 3) { showToast('Логин: латиница, 3+ символа'); return; }
    const oldFio = profile.fio;
    const oldLogin = profile.login;
    if (oldFio !== newFio || oldLogin !== newLogin) {
        if (!confirm('Файлы в облаке будут переименованы. Продолжить?')) return;
        try {
            await fetch('https://cloud-api.yandex.net/v1/disk/resources/move?from=' + encodeURIComponent(getDataFile(oldFio, oldLogin)) + '&path=' + encodeURIComponent(getDataFile(newFio, newLogin)) + '&overwrite=true',
                { method: 'POST', headers: { 'Authorization': 'OAuth ' + YANDEX_TOKEN } });
        } catch (e) {}
    }
    profile = { fio: newFio, login: newLogin, pck: newPck, category: newCategory, isClassTeacher: newIsClassTeacher, year: getYear(), createdAt: profile.createdAt };
    await saveSetting('profile', profile);
    const records = await getAllRecords();
    for (const r of records) {
        if (r.teacher === oldFio) { r.teacher = newFio; r.teacherLogin = newLogin; r.pck = newPck; await updateRecord(r); }
    }
    updateProfileUI();
    showToast('✅ Профиль обновлён');
    backToMain();
}

// ═══ MERGE ═══
async function mergeWithCloud() {
    if (!profile) return { added: 0, updated: 0 };
    const data = await downloadJson(getDataFile(profile.fio, profile.login));
    if (!data) return { added: 0, updated: 0 };

    const cloudRecords = [];
    for (const key of ['events','trainings','assessments','methodical','activity']) {
        if (data[key] && Array.isArray(data[key])) cloudRecords.push.apply(cloudRecords, data[key]);
    }

    const localRecords = (await getAllRecords()).filter(r => r.teacher === profile.fio);
    const localByKey = new Map();
    for (const r of localRecords) {
        const k = recordKey(r);
        if (k) localByKey.set(k, r);
    }

    let added = 0, updated = 0;
    for (const cloud of cloudRecords) {
        const key = recordKey(cloud);
        if (!key) continue;
        const local = localByKey.get(key);

        if (!local) {
            cloud.teacher = profile.fio;
            cloud.teacherLogin = profile.login;
            cloud.pck = profile.pck;
            cloud.sent = true;
            cloud.photoUploaded = true;
            cloud.fromCloud = true;
            if (!cloud.uid) cloud.uid = key;
            await saveRecordToDB(cloud);
            added++;
        } else {
            const cloudTime = new Date(cloud.updatedAt || cloud.createdAt).getTime();
            const localTime = new Date(local.updatedAt || local.createdAt).getTime();
            if (cloudTime > localTime) {
                const merged = Object.assign({}, cloud, {
                    id: local.id,
                    teacher: profile.fio,
                    teacherLogin: profile.login,
                    pck: profile.pck,
                    sent: true,
                    photoUploaded: true,
                    fromCloud: true
                });
                if (!merged.uid) merged.uid = local.uid || key;
                await updateRecord(merged);
                updated++;
            }
        }
    }
    return { added, updated };
}

// ═══ БАЗА ═══
function openDB() {
    return new Promise((resolve, reject) => {
        if (db) return resolve(db);
        const req = indexedDB.open('TeacherNotebook', 2);
        req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings');
            if (!d.objectStoreNames.contains('records')) d.createObjectStore('records', { keyPath: 'id', autoIncrement: true });
        };
        req.onsuccess = e => { db = e.target.result; resolve(db); };
        req.onerror = () => reject(req.error);
    });
}
async function saveSetting(k, v) { const d = await openDB(); return new Promise(r => { const tx = d.transaction('settings','readwrite'); tx.objectStore('settings').put(v,k); tx.oncomplete = r; }); }
async function getSetting(k) { const d = await openDB(); return new Promise(r => { const tx = d.transaction('settings','readonly'); const req = tx.objectStore('settings').get(k); req.onsuccess = () => r(req.result); }); }
async function saveRecordToDB(rec) { const d = await openDB(); return new Promise(r => { const tx = d.transaction('records','readwrite'); tx.objectStore('records').add(rec); tx.oncomplete = r; }); }
async function getAllRecords() { const d = await openDB(); return new Promise(r => { const tx = d.transaction('records','readonly'); const req = tx.objectStore('records').getAll(); req.onsuccess = () => r(req.result); }); }
async function updateRecord(rec) { const d = await openDB(); return new Promise(r => { const tx = d.transaction('records','readwrite'); tx.objectStore('records').put(rec); tx.oncomplete = r; }); }
async function deleteRecordById(id) { const d = await openDB(); return new Promise(r => { const tx = d.transaction('records','readwrite'); tx.objectStore('records').delete(id); tx.oncomplete = r; }); }

async function saveRecord() {
    const type = currentFormType;
    const now = new Date().toISOString();
    let record;

    if (editingRecordId) {
        const all = await getAllRecords();
        record = all.find(r => r.id === editingRecordId) || {};
        record.updatedAt = now;
    } else {
        record = {
            uid: 'l' + Date.now() + Math.random().toString(36).slice(2,8),
            createdAt: now,
            updatedAt: now,
            sent: false,
            fromCloud: false
        };
    }

    record.type = type;
    record.teacher = profile.fio;
    record.teacherLogin = profile.login;
    record.pck = profile.pck;
    record.year = getYear();

    const getVal = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    const getCheck = id => { const el = document.getElementById(id); return el ? el.checked : false; };

    record.name = getVal('f-name').trim();
    if (!record.name) { showToast('Введите название'); return; }
    record.date = getVal('f-date');
    record.prof = getCheck('f-prof');

    if (type === 'event') {
        record.eventType = getVal('f-type');
        if (record.eventType === 'другое') record.eventTypeCustom = getVal('f-type-custom');
        record.level = getVal('f-level'); record.participation = getVal('f-participation'); record.place = getVal('f-place');
        record.hasTeacher = getCheck('f-has-teacher'); record.hasStudents = getCheck('f-has-students');
        if (record.hasTeacher) record.teacherRoles = [...document.querySelectorAll('#f-roles-container .sub-block')].map(b => ({ role: b.querySelector('.t-role').value, result: b.querySelector('.t-result').value, place: b.querySelector('.t-place').value }));
        if (record.hasStudents) record.studentsGroups = [...document.querySelectorAll('#f-students-container .sub-block')].map(g => ({
            group: g.querySelector('.s-group').value, count: g.querySelector('.s-count').value, names: g.querySelector('.s-names').value,
            diplomas: [...g.querySelectorAll('.s-diplomas .sub-block')].map(d => ({ place: d.querySelector('.s-place').value, winner: d.querySelector('.s-winner').value }))
        }));
        const newPhoto = await getPhoto('f-photo'); if (newPhoto) record.photo = newPhoto;
    } else if (type === 'training') {
        record.trainingType = getVal('f-type');
        if (record.trainingType === 'другое') record.trainingTypeCustom = getVal('f-type-custom');
        record.hours = getVal('f-hours'); record.place = getVal('f-place');
        const newPhoto = await getPhoto('f-photo'); if (newPhoto) record.photo = newPhoto;
    } else if (type === 'assessment') {
        record.assessmentType = getVal('f-type'); record.group = getVal('f-group'); record.subject = getVal('f-subject');
        record.total = parseInt(getVal('f-total')) || 0; record.absent = parseInt(getVal('f-absent')) || 0; record.ovz = getCheck('f-ovz');
        if (record.assessmentType === 'проектная деятельность') record.project = getVal('f-project');
        else {
            record.count5 = parseInt(getVal('f-c5')) || 0; record.count4 = parseInt(getVal('f-c4')) || 0;
            record.count3 = parseInt(getVal('f-c3')) || 0; record.count2 = parseInt(getVal('f-c2')) || 0;
            record.taken = record.count5 + record.count4 + record.count3 + record.count2;
        }
    } else if (type === 'methodical') {
        record.methodicalType = getVal('f-type');
        if (record.methodicalType === 'другое') record.methodicalTypeCustom = getVal('f-type-custom');
        record.role = getVal('f-role'); record.status = getVal('f-status'); record.level = getVal('f-level');
        const newPhoto = await getPhoto('f-photo'); if (newPhoto) record.photo = newPhoto;
    } else if (type === 'activity') {
        record.activityType = getVal('f-type');
        if (record.activityType === 'другое') record.activityTypeCustom = getVal('f-type-custom');
        record.level = getVal('f-level');
        const newPhoto = await getPhoto('f-photo'); if (newPhoto) record.photo = newPhoto;
    }

    if (editingRecordId) {
        record.sent = false;
        record.fromCloud = false;
        await updateRecord(record);
    } else {
        await saveRecordToDB(record);
    }
    editingRecordId = null;
    clearForm();
    backToMain();
    showToast('✅ Сохранено. Не забудьте «Отправить в облако».');
}

async function getPhoto(inputId) {
    const input = document.getElementById(inputId);
    if (!input || !input.files || !input.files[0]) return null;
    return await compressImage(input.files[0]);
}
function compressImage(file, maxWidth = 800, quality = 0.7) {
    return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

async function editRecord(id) {
    const all = await getAllRecords();
    const rec = all.find(r => r.id === id);
    if (!rec) return;
    const age = Date.now() - new Date(rec.createdAt).getTime();
    if (age > 48 * 60 * 60 * 1000) { showToast('Прошло 48 часов — редактирование недоступно'); return; }

    editingRecordId = id;
    currentFormType = rec.type;
    document.getElementById('form-title').textContent = '✏️ Редактирование';
    renderForm(rec.type);

    setTimeout(() => {
        const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v == null ? '' : v; };
        const setC = (id, v) => { const el = document.getElementById(id); if (el) el.checked = !!v; };
        set('f-name', rec.name);
        set('f-date', rec.date);
        setC('f-prof', rec.prof);

        if (rec.type === 'event') {
            set('f-type', rec.eventType);
            if (rec.eventType === 'другое') { set('f-type-custom', rec.eventTypeCustom); document.getElementById('f-type-custom-group').classList.remove('hidden'); }
            set('f-level', rec.level); set('f-participation', rec.participation); set('f-place', rec.place);
            setC('f-has-teacher', rec.hasTeacher); setC('f-has-students', rec.hasStudents);
            if (rec.hasTeacher) { document.getElementById('f-teacher-block').classList.remove('hidden'); (rec.teacherRoles || []).forEach(r => addTeacherRole(r)); }
            if (rec.hasStudents) { document.getElementById('f-students-block').classList.remove('hidden'); (rec.studentsGroups || []).forEach(g => addStudentsGroup(g)); }
        } else if (rec.type === 'training') {
            set('f-type', rec.trainingType);
            if (rec.trainingType === 'другое') { set('f-type-custom', rec.trainingTypeCustom); document.getElementById('f-type-custom-group').classList.remove('hidden'); }
            set('f-hours', rec.hours); set('f-place', rec.place);
        } else if (rec.type === 'assessment') {
            set('f-type', rec.assessmentType);
            set('f-group', rec.group); set('f-subject', rec.subject); set('f-total', rec.total); set('f-absent', rec.absent);
            setC('f-ovz', rec.ovz);
            if (rec.assessmentType === 'проектная деятельность') {
                document.getElementById('f-grades-block').classList.add('hidden');
                document.getElementById('f-project-block').classList.remove('hidden');
                set('f-project', rec.project);
            } else {
                set('f-c5', rec.count5); set('f-c4', rec.count4); set('f-c3', rec.count3); set('f-c2', rec.count2);
            }
        } else if (rec.type === 'methodical') {
            set('f-type', rec.methodicalType);
            if (rec.methodicalType === 'другое') { set('f-type-custom', rec.methodicalTypeCustom); document.getElementById('f-type-custom-group').classList.remove('hidden'); }
            set('f-role', rec.role); set('f-status', rec.status); set('f-level', rec.level);
        } else if (rec.type === 'activity') {
            set('f-type', rec.activityType);
            if (rec.activityType === 'другое') { set('f-type-custom', rec.activityTypeCustom); document.getElementById('f-type-custom-group').classList.remove('hidden'); }
            set('f-level', rec.level);
        }
    }, 50);
    showScreen('screen-form');
}

async function addPhotoToRecord(id) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        showToast('⏳ Обработка фото...');
        const compressed = await compressImage(file);
        const all = await getAllRecords();
        const rec = all.find(r => r.id === id);
        if (!rec) return;
        rec.photo = compressed;
        rec.photoUploaded = false;
        rec.sent = false;
        await updateRecord(rec);
        showToast('✅ Фото прикреплено. Отправьте в облако.');
        showLocalRecords();
    };
    input.click();
}

// ═══ РУЧНАЯ ЗАГРУЗКА ═══
function handleManualUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.profile) { showToast('Неверный формат файла'); return; }
            
            const cloudRecords = [];
            for (const key of ['events','trainings','assessments','methodical','activity']) {
                if (data[key] && Array.isArray(data[key])) cloudRecords.push.apply(cloudRecords, data[key]);
            }
            const localRecords = await getAllRecords();
            const localByKey = new Map();
            for (const r of localRecords) {
                const k = recordKey(r);
                if (k) localByKey.set(k, r);
            }
            let added = 0, updated = 0;
            for (const cloud of cloudRecords) {
                const key = recordKey(cloud);
                if (!key) continue;
                const local = localByKey.get(key);
                if (!local) {
                    cloud.teacher = data.profile.fio || profile.fio;
                    cloud.teacherLogin = data.profile.login || profile.login;
                    cloud.pck = data.profile.pck || profile.pck;
                    cloud.sent = true; cloud.photoUploaded = true; cloud.fromCloud = true;
                    if (!cloud.uid) cloud.uid = key;
                    await saveRecordToDB(cloud);
                    added++;
                } else {
                    const cloudTime = new Date(cloud.updatedAt || cloud.createdAt).getTime();
                    const localTime = new Date(local.updatedAt || local.createdAt).getTime();
                    if (cloudTime > localTime) {
                        const merged = Object.assign({}, cloud, { id: local.id, teacher: profile.fio, teacherLogin: profile.login, pck: profile.pck, sent: true, photoUploaded: true, fromCloud: true });
                        if (!merged.uid) merged.uid = local.uid || key;
                        await updateRecord(merged);
                        updated++;
                    }
                }
            }
            showToast('Из файла: +' + added + ' новых, ' + updated + ' обновлено');
            document.getElementById('manual-upload').value = '';
            showLocalRecords();
        } catch (err) {
            alert('Ошибка чтения файла: ' + err.message);
        }
    };
    reader.readAsText(file);
}

async function loadFromCloud() {
    const btn = document.getElementById('load-cloud-btn');
    const manualBtn = document.getElementById('manual-load-btn');
    const diskBtn = document.getElementById('open-disk-btn');
    
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Загрузка...'; }
    if (manualBtn) manualBtn.classList.add('hidden');
    if (diskBtn) diskBtn.classList.add('hidden');
    
    try {
        const filePath = getDataFile(profile.fio, profile.login);
        const data = await downloadJson(filePath);

        if (!data) {
            if (manualBtn) manualBtn.classList.remove('hidden');
            if (diskBtn) diskBtn.classList.remove('hidden');
            alert('Не удалось скачать файл из облака.\n\nПуть: ' + filePath + '\n\nПроверьте интернет или зайдите позже.\n\nВоспользуйтесь кнопками:\n• «📁 Загрузить из файла» — выбрать JSON с телефона\n• «🔗 Открыть файл на Яндекс.Диске» — скачать вручную');
            if (btn) { btn.disabled = false; btn.textContent = '☁️ Загрузить из облака'; }
            return;
        }

        const total = (data.events||[]).length + (data.trainings||[]).length + (data.assessments||[]).length + (data.methodical||[]).length + (data.activity||[]).length;
        const res = await mergeWithCloud();

        if (res.added === 0 && res.updated === 0) {
            alert('Файл скачался, но новых записей нет.\n\nВ облаке: ' + total + ' записей.\nЛокально уже все есть.');
        } else {
            showToast('Из облака: +' + res.added + ' новых, ' + res.updated + ' обновлено');
        }
        showLocalRecords();
    } catch (e) {
        if (manualBtn) manualBtn.classList.remove('hidden');
        if (diskBtn) diskBtn.classList.remove('hidden');
        alert('Ошибка: ' + e.message);
    }
    if (btn) { btn.disabled = false; btn.textContent = '☁️ Загрузить из облака'; }
}

// ═══ ОТПРАВКА В ОБЛАКО ═══
async function sendToCloud() {
    const btn = document.getElementById('send-cloud-btn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Отправка...'; }
    try {
        const merged = await mergeWithCloud();
        const allRecords = (await getAllRecords()).filter(r => r.teacher === profile.fio);
        if (allRecords.length === 0) {
            showToast('Нет данных для отправки');
            if (btn) { btn.disabled = false; btn.textContent = '📤 Отправить в облако'; }
            return;
        }

        await ensureFolder(ROOT_FOLDER);
        await ensureFolder(ROOT_FOLDER + '/Входящие');
        await ensureFolder(ROOT_FOLDER + '/Входящие/photos');
        await ensureFolder(getPhotosFolder(profile.fio, profile.login));

        for (const record of allRecords) {
            if (record.photo && !record.photoUploaded) {
                try {
                    const filename = buildPhotoName(record);
                    const blob = await (await fetch(record.photo)).blob();
                    await uploadBlobToYandex(getPhotosFolder(profile.fio, profile.login) + '/' + filename, blob);
                    record.photoFilename = filename; record.photoUploaded = true; record.photo = null;
                    await updateRecord(record);
                } catch (e) { console.error('photo upload error', e); }
            }
        }

        const data = await buildDataFile();
        const dataFile = getDataFile(profile.fio, profile.login);
        await uploadToYandex(dataFile, JSON.stringify(data, null, 2));

        for (const r of allRecords) { if (!r.sent) { r.sent = true; await updateRecord(r); } }
        showToast('✅ Отправлено: ' + allRecords.length + ' (из облака: +' + merged.added + ')');
        showLocalRecords();
    } catch (e) {
        console.error(e);
        alert('Ошибка: ' + e.message);
    }
    if (btn) { btn.disabled = false; btn.textContent = '📤 Отправить в облако'; }
}

// ═══ СТАТИСТИКА ═══
async function showStatistics() {
    const btn = document.getElementById('stats-btn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Загрузка...'; }
    showScreen('screen-stats');
    document.getElementById('stats-content').innerHTML = '<p style="text-align:center;color:#8892a0;padding:40px 20px;">Загрузка...</p>';
    const folder = getStatsFolder(profile.fio, profile.login);
    
    let html = '';
    
    if (profile.isClassTeacher) {
        html += '<div class="card" style="background:#f0f8ff; border:2px solid #4A6CF7;">' +
                '<h3>👨‍🏫 Классное руководство</h3>' +
                '<p style="font-size:14px;color:#6b7684;">Здесь будет отображаться статистика вашей группы.</p>' +
                '<p style="font-size:12px;color:#8892a0;margin-top:10px;">(Модуль в разработке. Данные появятся после настройки справочников.)</p>' +
                '</div>';
    }
    
    try {
        const stats = await downloadJson(folder + '/statistics.json');
        if (!stats) {
            html += '<div class="card"><h3>📊 Статистика в обработке</h3><p style="font-size:14px;color:#6b7684;line-height:1.5;">Данные в обработке. Статистика появится здесь после завершения расчёта.</p></div>';
        } else {
            html += '<div class="card"><h3>📊 Моя статистика</h3>';
            if (stats.updated) html += '<p style="font-size:12px;color:#8892a0;">Обновлено: ' + new Date(stats.updated).toLocaleString('ru-RU') + '</p>';
            if (stats.total) html += '<p style="font-size:15px;margin:8px 0;">Баллов: <b>' + stats.total + '</b></p>';
            html += '</div>';
        }
    } catch (e) {
        html += '<p style="text-align:center;color:#e74c3c;padding:40px 20px;">Ошибка загрузки статистики</p>';
    }
    document.getElementById('stats-content').innerHTML = html;
    if (btn) { btn.disabled = false; btn.textContent = '📊 Обновить статистику'; }
}

// ═══ ОБЛАКО ═══
function getYear() { const now = new Date(); const y = now.getFullYear(); const m = now.getMonth() + 1; const start = m >= 9 ? y : y - 1; return start + '-' + (start + 1); }
function slug(str) { return String(str || '').trim().replace(/[^a-zA-Zа-яА-Я0-9\s\-_.]/g, '').replace(/\s+/g, '_').replace(/_+/g, '_').slice(0, 60) || 'без_названия'; }
function buildPhotoName(record) { const date = record.date || new Date().toISOString().slice(0, 10); return record.type + '_' + date + '_' + slug(record.name) + '.jpg'; }

async function ensureFolder(diskPath) {
    const res = await fetch('https://cloud-api.yandex.net/v1/disk/resources?path=' + encodeURIComponent(diskPath),
        { method: 'PUT', headers: { 'Authorization': 'OAuth ' + YANDEX_TOKEN } });
    if (res.status !== 201 && res.status !== 409) {
        const err = await res.json().catch(() => ({}));
        throw new Error('Папка: ' + (err.message || res.status));
    }
}
async function uploadToYandex(diskPath, content) {
    const urlRes = await fetch('https://cloud-api.yandex.net/v1/disk/resources/upload?path=' + encodeURIComponent(diskPath) + '&overwrite=true',
        { headers: { 'Authorization': 'OAuth ' + YANDEX_TOKEN } });
    if (!urlRes.ok) { const e = await urlRes.json().catch(()=>({})); throw new Error(e.message || 'URL ' + urlRes.status); }
    const data = await urlRes.json();
    const put = await fetch(data.href, { method: 'PUT', body: content });
    if (!put.ok && put.status !== 201) throw new Error('Upload ' + put.status);
}
async function uploadBlobToYandex(diskPath, blob) {
    const urlRes = await fetch('https://cloud-api.yandex.net/v1/disk/resources/upload?path=' + encodeURIComponent(diskPath) + '&overwrite=true',
        { headers: { 'Authorization': 'OAuth ' + YANDEX_TOKEN } });
    if (!urlRes.ok) throw new Error('URL error');
    const data = await urlRes.json();
    const put = await fetch(data.href, { method: 'PUT', body: blob });
    if (!put.ok && put.status !== 201) throw new Error('Upload ' + put.status);
}

async function downloadJson(diskPath) {
    try {
        const proxyUrl = PROXY_URL
            + 'path=' + encodeURIComponent(diskPath)
            + '&token=' + encodeURIComponent(YANDEX_TOKEN);

        const fileRes = await Promise.race([
            fetch(proxyUrl),
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout-proxy')), 30000))
        ]);

        if (!fileRes.ok) {
            const errText = await fileRes.text();
            console.warn('proxy failed:', fileRes.status, errText);
            return null;
        }

        const text = await fileRes.text();
        try {
            return JSON.parse(text);
        } catch (e) {
            console.error('not JSON:', text.slice(0, 200));
            return null;
        }
    } catch (e) {
        console.warn('downloadJson error:', e.message);
        return null;
    }
}

async function buildDataFile() {
    const records = (await getAllRecords()).filter(r => r.teacher === profile.fio && r.year === getYear());
    const clean = r => { const c = Object.assign({}, r); delete c.photo; delete c._photoBackup; return c; };
    return {
        profile: { fio: profile.fio, login: profile.login, pck: profile.pck, category: profile.category, isClassTeacher: profile.isClassTeacher, year: getYear() },
        events: records.filter(r => r.type === 'event').map(clean),
        trainings: records.filter(r => r.type === 'training').map(clean),
        assessments: records.filter(r => r.type === 'assessment').map(clean),
        methodical: records.filter(r => r.type === 'methodical').map(clean),
        activity: records.filter(r => r.type === 'activity').map(clean),
        updated: new Date().toISOString()
    };
}

async function forceUpdate() {
    if (!confirm('Обновить приложение?')) return;
    showToast('⏳ Обновляем...');
    try {
        if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const r of regs) { await r.unregister(); }
        }
        if ('caches' in window) {
            const keys = await caches.keys();
            for (const k of keys) { await caches.delete(k); }
        }
        showToast('✅ Готово. Перезагрузка...');
        setTimeout(() => { window.location.reload(true); }, 800);
    } catch (e) { alert('Ошибка: ' + e.message); }
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 3500);
}
